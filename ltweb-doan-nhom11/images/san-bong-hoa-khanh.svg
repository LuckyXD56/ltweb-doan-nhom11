<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Sân bóng mini Hòa Khánh</title>
  <desc id="desc">Hình minh họa sân bóng mini với mặt sân, khung, dải đánh dấu và hệ thống chiếu sáng.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff7d8"/>
      <stop offset="100%" stop-color="#bfe9b5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#eaf7ef"/>
  <rect x="80" y="80" width="1040" height="540" rx="18" fill="url(#bg)" stroke="#2c8f3c" stroke-width="10"/>
  <rect x="210" y="170" width="780" height="360" rx="8" fill="#77c56e" stroke="#2a7b33" stroke-width="8"/>
  <line x1="600" y1="170" x2="600" y2="530" stroke="#f6f9f6" stroke-width="6"/>
  <circle cx="600" cy="350" r="68" fill="none" stroke="#f6f9f6" stroke-width="6"/>
